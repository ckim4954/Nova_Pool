
name: Nova Pool - Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Nova Pool APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check project configuration
        shell: bash
        run: |
          set -e

          test -f gradlew
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradle/libs.versions.toml

          chmod +x gradlew

          echo "Project structure OK"

      - name: Locate SDK Manager
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager \
            -print -quit)

          test -n "$SDKMANAGER"

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "Found: $SDKMANAGER"

      - name: Accept SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses
          set -o pipefail

      - name: Install Android SDK 37
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --channel=3 \
            --list > sdk-packages.txt

          if ! grep -q 'platforms;android-37.0' sdk-packages.txt; then
            echo "Android API 37.0 package unavailable"
            grep -i 'android-37' sdk-packages.txt || true
            exit 1
          fi

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --channel=3 \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

      - name: Fix Android 37 SDK directory alias
        shell: bash
        run: |
          set -e

          PLATFORM="$ANDROID_HOME/platforms"

          if [ ! -d "$PLATFORM/android-37.0" ]; then
            echo "Android 37 platform missing"
            exit 1
          fi

          if [ ! -e "$PLATFORM/android-37" ]; then
            ln -s android-37.0 "$PLATFORM/android-37"
          fi

          ls -la "$PLATFORM"

          test -f "$PLATFORM/android-37/android.jar"

      - name: Verify build environment
        run: |
          java -version
          "$SDKMANAGER" --version
          ./gradlew --version

      - name: Run unit tests
        run: |
          ./gradlew :app:testDebugUnitTest \
            --no-daemon \
            --stacktrace

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "APK missing or empty"
            find app/build/outputs -type f || true
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Pool-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
