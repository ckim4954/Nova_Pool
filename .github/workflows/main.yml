
name: Build Nova Pool Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: nova-pool-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify project structure
        shell: bash
        run: |
          test -f gradlew
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle/libs.versions.toml
          test -f app/build.gradle.kts
          test -f gradle/wrapper/gradle-wrapper.properties
          echo "Nova Pool project structure verified"

      - name: Install Android SDK packages
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          command -v sdkmanager

          sdkmanager --version

          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;36.0.0"

      - name: Verify Java and Gradle
        run: |
          java -version
          chmod +x gradlew
          ./gradlew --version

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated"
            find app/build/outputs -type f || true
            exit 1
          fi

          ls -lh "$APK"
          echo "APK_SIZE=$(du -h "$APK" | cut -f1)" >> "$GITHUB_ENV"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Pool-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
